services:
  digibyte-ckpool:
    build:
      context: ckpool/
      args:
        TARGETARCH: amd64
    container_name: digibyte-ckpool
    restart: always
    entrypoint: ["/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "bash", "/healthcheck.sh"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 60s
    environment:
      # DigiByte config (Docker-safe)
      TESTNET: "0"
      ALGO: "sha256d"
      DAEMON: "0"              # <- MUST be 0
      SERVER: "1"
      TXINDEX: "1"             # <- matches existing datadir
      MAXCONNECTIONS: "300"
      DISABLEWALLET: "0"
      RPCALLOWIP: "0.0.0.0/0"
      PORT: "12024"
      RPCPORT: "14022"         # <- your working RPC port
      RPCBIND: "0.0.0.0"
      RPCUSER: "rpcuser"
      RPCPASSWORD: "rpcpassword"
      ONLYNET: "IPv4"
      ZMQPUBHASHBLOCK: "tcp://127.0.0.1:28435"
      DATADIR: "/home/cna.digibyte/mainnet"

      # ckpool config
      BTCD_URL: "127.0.0.1:14022"  # <- match DigiByte RPC
      BTCD_AUTH: "rpcuser"
      BTCD_PASS: "rpcpassword"
      SERVERURL: "0.0.0.0:3333"
      BTCADDRESS: "xxx"
      BTCSIG: "/mined by SoloBoost/"
      BLOCKPOLL: "50"
      DONATION: "0.0"
      NONCE1LENGTH: "4"
      NONCE2LENGTH: "8"
      UPDATE_INTERVAL: "5"
      VERSION_MASK: "1fffe000"
      MINDIFF: "512"
      STARTDIFF: "10000"
      LOGDIR: "/logs"
      ZMQBLOCK: "tcp://127.0.0.1:28435"

    volumes:
      - ./ckpool/data:/home/cna.digibyte/mainnet
      - ./ckpool/data/logs:/logs

    ports:
      - "12024:12024"    # p2p
      - "14022:14022"  # rpc (new port)
      - "3333:3333"    # ckpool stratum
      - "4028:4028"    # ckpool API
      - "3001:80"      # Apache / logs

  db:
    image: postgres:13
    restart: always
    container_name: db
    environment:
      POSTGRES_USER: ckstats
      POSTGRES_PASSWORD: ckstats
      POSTGRES_DB: ckstats
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ckstats -t 20 && psql -U ckstats -d ckstats -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 20s
      timeout: 30s
      retries: 5

  ckstats:
    build:
      context: ckstats/
      dockerfile: Dockerfile
      args:
        TARGETARCH: amd64
    container_name: ckstats
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://ckstats:ckstats@db/ckstats"
      SHADOW_DATABASE_URL: "postgres://ckstats:ckstats@db/dbshadow"
      API_URL: "http://digibyte-ckpool:4028"
      RPCUSER: "rpcuser"
      RPCPASSWORD: "rpcpassword"
      RPCPORT: "14022"   # <- match DigiByte RPC
    ports:
      - "3000:3000"




